name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,langgraph]"
      - run: ruff check src tests examples benchmarks
      - run: ruff format --check src tests examples benchmarks
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m agent_action_evals examples/refund_scenarios.py --repeat 3 --json report.json --junit report.xml
      - run: python -m agent_action_evals examples/langgraph_refund_demo.py --repeat 3 --json langgraph-offline.json --junit langgraph-offline.xml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: docker pull python:3.11-slim
      - run: python -m pytest tests/test_process.py -q
        env:
          AAE_DOCKER_TESTS: '1'
      - run: python benchmarks/run.py --sizes 100
