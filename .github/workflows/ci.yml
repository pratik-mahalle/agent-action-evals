name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,langgraph,live]"
      - run: ruff check src tests examples benchmarks
      - run: ruff format --check src tests examples benchmarks
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m agent_action_evals examples/refund_scenarios.py --repeat 3 --json report.json --junit report.xml
      - run: python -m agent_action_evals examples/langgraph_refund_demo.py --repeat 3 --json langgraph-offline.json --junit langgraph-offline.xml
      - run: python -m agent_action_evals examples/refund_pack.py --repeat 2 --text refund-pack.txt --json refund-pack.json
      - run: python -m agent_action_evals examples/langgraph_refund_pack.py --repeat 2 --text langgraph-refund-pack.txt
      - run: python -m agent_action_evals examples/verified_refund.py --repeat 2 --json verified-refund.json
      - run: python -m agent_action_evals examples/langgraph_verified_refund.py --repeat 2 --json langgraph-verified-refund.json
      - run: python benchmarks/verification.py --repeat 2 --output verification-benchmark.json
      - run: python examples/wrapped_sqlite_tool.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: docker pull python:3.11-slim
      - run: python -m pytest tests/test_process.py -q
        env:
          AAE_DOCKER_TESTS: '1'
      - run: python benchmarks/run.py --sizes 100
  comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FailproofAI/failproofai
          ref: b8cce3b221f94b74b7283a6df63ffb603712776a
          path: upstream-failproof
          sparse-checkout: sdk/python
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_comparison.py -q
        env:
          AAE_FAILPROOF_SOURCE: ${{ github.workspace }}/upstream-failproof
