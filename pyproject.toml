[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-action-evals"
version = "0.2.0a1"
description = "Stateful action-boundary tests for tool-using agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Agent Action Evals contributors"}]
dependencies = ["jsonschema>=4.23,<5"]

[project.urls]
Homepage = "https://github.com/pratik-mahalle/agent-action-evals"
Documentation = "https://github.com/pratik-mahalle/agent-action-evals#readme"
Issues = "https://github.com/pratik-mahalle/agent-action-evals/issues"

[project.optional-dependencies]
dev = ["ruff>=0.11", "build>=1.2", "pytest>=8"]
langgraph = ["langgraph>=1,<2", "langchain-anthropic>=1,<2"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
agent-action-evals = "agent_action_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
